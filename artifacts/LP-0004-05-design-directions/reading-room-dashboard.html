<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LP-0004-05 · reading-room · 首頁</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../.claude/skills/neta-design/tokens/reading-room.css">
  <link rel="stylesheet" href="system.css">
  <link rel="stylesheet" href="reading-room-layout.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="#" class="logo" title="專利法刷題">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </a>
      <input type="checkbox" id="menu-toggle" class="menu-toggle sr-only">
      <label for="menu-toggle" class="menu-trigger">首頁</label>
      <div class="law-type-selector select-wrap">
        <select id="law-type-select" class="law-type-select" title="選擇法律類型">
          <option selected>專利法</option><option>專利審查基準</option><option>訴願法</option><option>行政訴訟法</option>
        </select>
      </div>
      <div class="menu">
        <nav class="nav">
          <a href="#" class="nav-link active" aria-current="page">首頁</a>
          <a href="#" class="nav-link">法條瀏覽</a>
          <a href="#" class="nav-link">題庫</a>
          <a href="#" class="nav-link">我的進度</a>
        </nav>
        <div class="header-right">
          <div class="lang-toggle">
            <button id="lang-zh" class="lang-btn active" title="切換到中文">中</button>
            <button id="lang-en" class="lang-btn" title="Switch to English">EN</button>
          </div>
          <div class="user-menu">
            <!-- stand-in --><span id="user-display-name" class="user-name">王小明</span>
            <button id="logout-btn" class="icon-btn btn-logout" title="登出">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page dash">
    <section class="lead">
      <a href="#" class="btn btn-primary btn-block btn-lg">開始新測驗</a>
      <a href="#" class="arrow-link">我的題目 →</a>
    </section>

    <section class="chapters">
      <h2 class="section-title">法條瀏覽</h2>
      <!-- chapter names and article counts from knowledge/patent_law_zh.md -->
      <ul class="chapter-list">
        <li><a href="#" class="chapter-card"><span>第 一 章 總則</span><span class="badge badge-count">20</span></a></li>
        <li><a href="#" class="chapter-card"><span>第 二 章 發明專利</span><span class="badge badge-count">88</span></a></li>
        <li><a href="#" class="chapter-card"><span>第 三 章 新型專利</span><span class="badge badge-count">17</span></a></li>
        <li><a href="#" class="chapter-card"><span>第 四 章 設計專利</span><span class="badge badge-count">22</span></a></li>
        <li><a href="#" class="chapter-card"><span>第 五 章 附則</span><span class="badge badge-count">21</span></a></li>
      </ul>
    </section>

    <aside class="tips">
      <h2>💡 學習小提示</h2>
      <ul>
        <li>✓ 每天至少練習 10 題以保持連續記錄</li>
        <li>✓ 收藏重點法條以便快速複習</li>
        <li>✓ 連續答對 3 次即達到「精熟」狀態</li>
        <li>✓ 使用「複習模式」強化需要加強的題目</li>
      </ul>
    </aside>
  </main>
</body>
</html>
