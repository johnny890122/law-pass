{% extends "base.html" %}

{% block title %}我的題目 - 專利法 AI 刷題助手{% endblock %}

{% block main_class %}narrow{% endblock %}

{% block content %}
<h1 class="page-title">我的題目</h1>

<!-- Tab Navigation -->
<div class="filter-tabs" role="tablist">
    <button class="filter-tab tab-btn active"
            data-tab="starred"
            role="tab"
            aria-selected="true"
            aria-controls="questions-container">
        ⭐ 收藏題目
    </button>
    <button class="filter-tab tab-btn"
            data-tab="wrong"
            role="tab"
            aria-selected="false"
            aria-controls="questions-container">
        ❌ 答錯題目
    </button>
</div>

<!-- Filter, states, and the questions share one panel -->
<section class="card">
    <div class="filter-tabs">
        <button class="filter-tab filter-btn active" data-filter="all">全部</button>
        <button class="filter-tab filter-btn" data-filter="MCQ" data-flag="accent">選擇題</button>
        <button class="filter-tab filter-btn" data-filter="ShortAnswer" data-flag="short">問答題</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="spinner"></div>
        <span class="sr-only">載入中...</span>
    </div>

    <!-- Error State -->
    <div id="error-state" class="empty-state hidden">
        <div class="empty-state-icon">⚠️</div>
        <h3 class="empty-state-title">載入失敗</h3>
        <p class="empty-state-text">
            無法載入題目，請檢查網路連線
        </p>
        <button id="retry-btn" class="btn btn-primary">重試</button>
    </div>

    <!-- Questions List -->
    <div id="questions-container" class="question-list hidden" role="region" aria-live="polite">
        <!-- Questions will be rendered here -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon" id="empty-icon">📭</div>
        <h3 class="empty-state-title" id="empty-title">尚無收藏的題目</h3>
        <p class="empty-state-text" id="empty-desc">
            在答題或法條詳情頁面點擊 ⭐ 來收藏題目
        </p>
        <a href="/quiz/config" class="btn btn-primary">開始答題</a>
    </div>
</section>

<!-- Pagination -->
<div id="pagination" class="card pager hidden">
    <button id="prev-btn" class="btn btn-outline btn-sm" disabled>← 上一頁</button>
    <span id="page-info" class="pager-info">第 1 頁</span>
    <button id="next-btn" class="btn btn-outline btn-sm">下一頁 →</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Constants
const TABS = {
    STARRED: 'starred',
    WRONG: 'wrong'
};

const QUESTION_TYPES = {
    ALL: 'all',
    MCQ: 'MCQ',
    SHORT_ANSWER: 'ShortAnswer'
};

const PER_PAGE = 5;
const PASS_THRESHOLD = 0.7;

// State
let currentPage = 1;
let totalPages = 1;
let totalCount = 0;
let currentTab = TABS.STARRED;
let currentFilter = QUESTION_TYPES.ALL;
let currentRequest = null;

// DOM elements
const loadingEl = document.getElementById('loading');
const errorStateEl = document.getElementById('error-state');
const questionsContainer = document.getElementById('questions-container');
const emptyStateEl = document.getElementById('empty-state');
const paginationEl = document.getElementById('pagination');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pageInfo = document.getElementById('page-info');
const retryBtn = document.getElementById('retry-btn');
const filterBtns = document.querySelectorAll('.filter-btn');
const tabBtns = document.querySelectorAll('.tab-btn');

// Utility: HTML escape to prevent XSS
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Utility: Extract correct option letter (e.g., "A", "B")
function getCorrectOptionLetter(correctAnswer) {
    if (!correctAnswer) return null;
    const match = correctAnswer.match(/^([A-Z])\./);
    return match ? match[1] : null;
}

// Load questions with pagination and filtering
async function loadQuestions(page = 1) {
    try {
        // Cancel previous request if exists
        if (currentRequest) {
            currentRequest.abort();
        }
        currentRequest = new AbortController();
        
        currentPage = page;
        showLoading();
        
        // Build URL with filters
        const currentLang = localStorage.getItem('appLang') || 'zh-TW';
        const params = new URLSearchParams({
            tab: currentTab,
            page: page.toString(),
            per_page: PER_PAGE.toString(),
            lang: currentLang
        });
        
        // Add type filter if not "all"
        if (currentFilter !== QUESTION_TYPES.ALL) {
            params.append('type', currentFilter);
        }
        
        const response = await fetch(
            `/api/questions/my-questions?${params.toString()}`,
            { signal: currentRequest.signal }
        );
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        const questions = data.questions || [];
        totalCount = data.total || 0;
        totalPages = data.total_pages || 1;
        
        if (totalCount === 0) {
            showEmptyState();
            return;
        }
        
        renderQuestions(questions);
        updatePagination();
        showQuestions();
        
    } catch (error) {
        if (error.name === 'AbortError') {
            // Request was cancelled, ignore
            return;
        }
        console.error('Error loading questions:', error);
        showError();
    } finally {
        currentRequest = null;
    }
}

// Render questions to DOM
function renderQuestions(questions) {
    const fragment = document.createDocumentFragment();
    
    questions.forEach(q => {
        const card = createQuestionCard(q);
        fragment.appendChild(card);
    });
    
    questionsContainer.innerHTML = '';
    questionsContainer.appendChild(fragment);
}

// Create a question card element
function createQuestionCard(q) {
    const card = document.createElement('div');
    card.className = 'question-item';
    
    // Type icon and name
    const typeIcon = q.type === QUESTION_TYPES.MCQ ? '📝' : '✍️';
    const typeName = q.type === QUESTION_TYPES.MCQ ? '選擇題' : '問答題';
    
    // Score badge
    let scoreBadgeHtml = '';
    if (q.last_score !== null && q.last_score !== undefined) {
        const scorePercent = Math.round(q.last_score * 100);
        const scoreClass = q.last_score >= PASS_THRESHOLD ? 'badge-success' : 'badge-danger';
        scoreBadgeHtml = `<span class="badge ${scoreClass}">得分: ${scorePercent}%</span>`;
    }
    
    // Law accuracy badge (答對率)
    let lawAccuracyHtml = '';
    if (q.law_info && q.law_info.attempt_count > 0) {
        const accuracy = Math.round(q.law_info.avg_score * 100);
        const accuracyClass = q.law_info.avg_score >= PASS_THRESHOLD ? 'badge-success' : 'badge-danger';
        lawAccuracyHtml = `<span class="badge ${accuracyClass}" title="此法條答對率 (${q.law_info.attempt_count}次作答)">法條: ${accuracy}%</span>`;
    }
    
    // Options for MCQ
    let optionsHtml = '';
    if (q.type === QUESTION_TYPES.MCQ && q.options && q.options.length > 0) {
        const correctLetter = getCorrectOptionLetter(q.correct_answer);
        optionsHtml = '<div class="item-options">';
        q.options.forEach(option => {
            const optionLetter = option.trim().charAt(0);
            const isCorrect = correctLetter && optionLetter === correctLetter;
            const optionClass = isCorrect ? 'correct' : '';
            optionsHtml += `<div class="${optionClass}">${escapeHtml(option)}</div>`;
        });
        optionsHtml += '</div>';
    }
    
    // Answer section
    let answerHtml = '';
    if (q.correct_answer || q.ai_explanation) {
        answerHtml = '<div class="question-answer-section">';
        if (q.type === QUESTION_TYPES.SHORT_ANSWER && q.correct_answer) {
            answerHtml += `<div><strong>✓ 正確答案：</strong>${escapeHtml(q.correct_answer)}</div>`;
        }
        if (q.ai_explanation) {
            answerHtml += `<div><strong>說明：</strong>${escapeHtml(q.ai_explanation)}</div>`;
        }
        answerHtml += '</div>';
    }
    
    const starIcon = q.is_starred ? '⭐' : '☆';
    const starLabel = q.is_starred ? '取消收藏' : '收藏題目';
    
    card.innerHTML = `
        <div class="question-item-head">
            <div>
                <span class="badge ${q.type === QUESTION_TYPES.MCQ ? 'badge-mcq' : 'badge-short'}">${typeIcon} ${typeName}</span>
                <a class="law-link" href="/laws/${escapeHtml(q.law_id)}">${escapeHtml(q.law_info.article_number)}</a>
                ${lawAccuracyHtml}
                ${scoreBadgeHtml}
            </div>
            <button class="icon-btn star-btn"
                    data-question-id="${escapeHtml(q._id)}"
                    data-is-starred="${q.is_starred}"
                    aria-label="${starLabel}">
                ${starIcon}
            </button>
        </div>
        <div>${escapeHtml(q.content)}</div>
        ${optionsHtml}
        ${answerHtml}
    `;
    
    return card;
}

// Toggle star status
async function toggleStar(questionId, btn) {
    try {
        const response = await fetch(`/api/quiz/questions/${questionId}/star`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        
        if (!response.ok) throw new Error('Failed to toggle star');
        
        const data = await response.json();
        
        // Update button
        btn.textContent = data.is_starred ? '⭐' : '☆';
        btn.setAttribute('data-is-starred', data.is_starred);
        btn.setAttribute('aria-label', data.is_starred ? '取消收藏' : '收藏題目');
        
        window.appUtils.showToast(data.message, 'success');
        
        // If in starred tab and unstarring, reload to remove from list
        if (currentTab === TABS.STARRED && !data.is_starred) {
            // If this was the last item on the page, go to previous page
            const cardsRemaining = questionsContainer.children.length - 1;
            if (cardsRemaining === 0 && currentPage > 1) {
                loadQuestions(currentPage - 1);
            } else {
                loadQuestions(currentPage);
            }
        }
        
    } catch (error) {
        console.error('Error toggling star:', error);
        window.appUtils.showToast('操作失敗，請稍後再試', 'error');
    }
}

// Update pagination controls
function updatePagination() {
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
    pageInfo.textContent = `第 ${currentPage} / ${totalPages} 頁 (共 ${totalCount} 題)`;
}

// Update empty state based on current tab
function updateEmptyState() {
    const emptyIcon = document.getElementById('empty-icon');
    const emptyTitle = document.getElementById('empty-title');
    const emptyDesc = document.getElementById('empty-desc');
    
    if (currentTab === TABS.STARRED) {
        emptyIcon.textContent = '📭';
        emptyTitle.textContent = currentFilter === QUESTION_TYPES.ALL ? '尚無收藏的題目' : '尚無此類型的收藏題目';
        emptyDesc.textContent = '在答題或法條詳情頁面點擊 ⭐ 來收藏題目';
    } else {
        emptyIcon.textContent = '✨';
        emptyTitle.textContent = currentFilter === QUESTION_TYPES.ALL ? '太棒了！目前沒有答錯的題目' : '太棒了！此類型沒有答錯的題目';
        emptyDesc.textContent = '繼續保持，持續精進你的專利法知識！';
    }
}

// UI State management
function showLoading() {
    loadingEl.classList.remove('hidden');
    questionsContainer.classList.add('hidden');
    emptyStateEl.classList.add('hidden');
    errorStateEl.classList.add('hidden');
    paginationEl.classList.add('hidden');
}

function showQuestions() {
    loadingEl.classList.add('hidden');
    questionsContainer.classList.remove('hidden');
    emptyStateEl.classList.add('hidden');
    errorStateEl.classList.add('hidden');
    paginationEl.classList.remove('hidden');
}

function showEmptyState() {
    loadingEl.classList.add('hidden');
    questionsContainer.classList.add('hidden');
    emptyStateEl.classList.remove('hidden');
    errorStateEl.classList.add('hidden');
    paginationEl.classList.add('hidden');
    updateEmptyState();
}

function showError() {
    loadingEl.classList.add('hidden');
    questionsContainer.classList.add('hidden');
    emptyStateEl.classList.add('hidden');
    errorStateEl.classList.remove('hidden');
    paginationEl.classList.add('hidden');
}

// Event delegation for questions container
questionsContainer.addEventListener('click', (e) => {
    // Handle star button clicks
    if (e.target.classList.contains('star-btn') || e.target.closest('.star-btn')) {
        const btn = e.target.classList.contains('star-btn') ? e.target : e.target.closest('.star-btn');
        const questionId = btn.getAttribute('data-question-id');
        toggleStar(questionId, btn);
        return;
    }
    
});

// Tab button handlers
tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const newTab = btn.getAttribute('data-tab');
        if (newTab === currentTab) return;
        
        currentTab = newTab;
        
        // Update active state and ARIA
        tabBtns.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        
        // Reset page
        loadQuestions(1);
    });
});

// Filter button handlers
filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const newFilter = btn.getAttribute('data-filter');
        if (newFilter === currentFilter) return;
        
        currentFilter = newFilter;
        
        // Update active state
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Reset to page 1 when changing filter
        loadQuestions(1);
    });
});

// Pagination button handlers
prevBtn.addEventListener('click', () => {
    if (currentPage > 1) {
        loadQuestions(currentPage - 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
});

nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) {
        loadQuestions(currentPage + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
});

// Retry button handler
retryBtn.addEventListener('click', () => {
    loadQuestions(currentPage);
});

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadQuestions(1);
});
</script>
{% endblock %}
