{% extends "base.html" %}

{% block title %}全部題庫 - 專利法 AI 刷題助手{% endblock %}

{% block main_class %}narrow{% endblock %}

{% block content %}
<div>
    <h1 class="page-title">全部題庫</h1>
    <p class="page-subtitle">瀏覽目前法律類型下的所有題目</p>
</div>

<!-- Filter, states, and the questions share one panel -->
<section class="card">
    <div class="filter-tabs">
        <button class="filter-tab filter-btn active" data-filter="all">全部</button>
        <button class="filter-tab filter-btn" data-filter="MCQ" data-flag="accent">選擇題</button>
        <button class="filter-tab filter-btn" data-filter="ShortAnswer" data-flag="short">問答題</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="spinner"></div>
        <span class="sr-only">載入中...</span>
    </div>

    <!-- Error State -->
    <div id="error-state" class="empty-state hidden">
        <div class="empty-state-icon">⚠️</div>
        <h3 class="empty-state-title">載入失敗</h3>
        <p class="empty-state-text">無法載入題目，請檢查網路連線</p>
        <button id="retry-btn" class="btn btn-primary">重試</button>
    </div>

    <!-- Questions List -->
    <div id="questions-container" class="question-list hidden" role="region" aria-live="polite"></div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon">📭</div>
        <h3 class="empty-state-title">目前沒有題目</h3>
        <p class="empty-state-text">此法律類型尚無可用題目</p>
        <a href="/quiz/config" class="btn btn-primary">開始答題以生成題目</a>
    </div>
</section>

<!-- Pagination -->
<div id="pagination" class="card pager hidden">
    <button id="prev-btn" class="btn btn-outline btn-sm" disabled>← 上一頁</button>
    <span id="page-info" class="pager-info">第 1 頁</span>
    <button id="next-btn" class="btn btn-outline btn-sm">下一頁 →</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
const QUESTION_TYPES = { ALL: 'all', MCQ: 'MCQ', SHORT_ANSWER: 'ShortAnswer' };
const PASS_THRESHOLD = 0.7;
const PER_PAGE = 5;

let currentPage = 1;
let totalPages = 1;
let totalCount = 0;
let currentFilter = QUESTION_TYPES.ALL;
let currentRequest = null;

const loadingEl = document.getElementById('loading');
const errorStateEl = document.getElementById('error-state');
const questionsContainer = document.getElementById('questions-container');
const emptyStateEl = document.getElementById('empty-state');
const paginationEl = document.getElementById('pagination');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pageInfo = document.getElementById('page-info');
const retryBtn = document.getElementById('retry-btn');
const filterBtns = document.querySelectorAll('.filter-btn');

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getCorrectOptionLetter(correctAnswer) {
    if (!correctAnswer) return null;
    const match = correctAnswer.match(/^([A-Z])\./);
    return match ? match[1] : null;
}

async function loadQuestions(page = 1) {
    try {
        if (currentRequest) currentRequest.abort();
        currentRequest = new AbortController();
        currentPage = page;
        showLoading();

        const currentLang = localStorage.getItem('appLang') || 'zh-TW';
        const params = new URLSearchParams({
            page: page.toString(),
            per_page: PER_PAGE.toString(),
            lang: currentLang
        });
        if (currentFilter !== QUESTION_TYPES.ALL) {
            params.append('type', currentFilter);
        }

        const response = await fetch(
            `/api/questions/all?${params.toString()}`,
            { signal: currentRequest.signal }
        );
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const questions = data.questions || [];
        totalCount = data.total || 0;
        totalPages = data.total_pages || 1;

        if (totalCount === 0) { showEmptyState(); return; }

        renderQuestions(questions);
        updatePagination();
        showQuestions();
    } catch (error) {
        if (error.name === 'AbortError') return;
        console.error('Error loading questions:', error);
        showError();
    } finally {
        currentRequest = null;
    }
}

function renderQuestions(questions) {
    const fragment = document.createDocumentFragment();
    questions.forEach(q => fragment.appendChild(createQuestionCard(q)));
    questionsContainer.innerHTML = '';
    questionsContainer.appendChild(fragment);
}

function createQuestionCard(q) {
    const card = document.createElement('div');
    card.className = 'question-item';

    const typeIcon = q.type === QUESTION_TYPES.MCQ ? '📝' : '✍️';
    const typeName = q.type === QUESTION_TYPES.MCQ ? '選擇題' : '問答題';

    let scoreBadgeHtml = '';
    if (q.last_score !== null && q.last_score !== undefined) {
        const scorePercent = Math.round(q.last_score * 100);
        const scoreClass = q.last_score >= PASS_THRESHOLD ? 'badge-success' : 'badge-danger';
        scoreBadgeHtml = `<span class="badge ${scoreClass}">得分: ${scorePercent}%</span>`;
    } else {
        scoreBadgeHtml = `<span class="badge badge-count">未作答</span>`;
    }

    let optionsHtml = '';
    if (q.type === QUESTION_TYPES.MCQ && q.options && q.options.length > 0) {
        const correctLetter = getCorrectOptionLetter(q.correct_answer);
        optionsHtml = '<div class="item-options">';
        q.options.forEach(option => {
            const optionLetter = option.trim().charAt(0);
            const isCorrect = correctLetter && optionLetter === correctLetter;
            optionsHtml += `<div class="${isCorrect ? 'correct' : ''}">${escapeHtml(option)}</div>`;
        });
        optionsHtml += '</div>';
    }

    let answerHtml = '';
    if (q.correct_answer || q.ai_explanation) {
        answerHtml = '<div class="question-answer-section">';
        if (q.type === QUESTION_TYPES.SHORT_ANSWER && q.correct_answer) {
            answerHtml += `<div><strong>✓ 正確答案：</strong>${escapeHtml(q.correct_answer)}</div>`;
        }
        if (q.ai_explanation) {
            answerHtml += `<div><strong>說明：</strong>${escapeHtml(q.ai_explanation)}</div>`;
        }
        answerHtml += '</div>';
    }

    const starIcon = q.is_starred ? '⭐' : '☆';
    const starLabel = q.is_starred ? '取消收藏' : '收藏題目';

    card.innerHTML = `
        <div class="question-item-head">
            <div>
                <span class="badge ${q.type === QUESTION_TYPES.MCQ ? 'badge-mcq' : 'badge-short'}">${typeIcon} ${typeName}</span>
                <a class="law-link" href="/laws/${escapeHtml(q.law_id)}">${escapeHtml(q.law_info.article_number)}</a>
                ${scoreBadgeHtml}
            </div>
            <button class="icon-btn star-btn"
                    data-question-id="${escapeHtml(q._id)}"
                    data-is-starred="${q.is_starred}"
                    aria-label="${starLabel}">
                ${starIcon}
            </button>
        </div>
        <div>${escapeHtml(q.content)}</div>
        ${optionsHtml}
        ${answerHtml}
    `;
    return card;
}

async function toggleStar(questionId, btn) {
    try {
        const response = await fetch(`/api/quiz/questions/${questionId}/star`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        if (!response.ok) throw new Error('Failed to toggle star');
        const data = await response.json();
        btn.textContent = data.is_starred ? '⭐' : '☆';
        btn.setAttribute('data-is-starred', data.is_starred);
        btn.setAttribute('aria-label', data.is_starred ? '取消收藏' : '收藏題目');
        window.appUtils.showToast(data.message, 'success');
    } catch (error) {
        console.error('Error toggling star:', error);
        window.appUtils.showToast('操作失敗，請稍後再試', 'error');
    }
}

function updatePagination() {
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
    pageInfo.textContent = `第 ${currentPage} / ${totalPages} 頁 (共 ${totalCount} 題)`;
}

function showLoading() {
    loadingEl.classList.remove('hidden');
    questionsContainer.classList.add('hidden');
    emptyStateEl.classList.add('hidden');
    errorStateEl.classList.add('hidden');
    paginationEl.classList.add('hidden');
}

function showQuestions() {
    loadingEl.classList.add('hidden');
    questionsContainer.classList.remove('hidden');
    emptyStateEl.classList.add('hidden');
    errorStateEl.classList.add('hidden');
    paginationEl.classList.remove('hidden');
}

function showEmptyState() {
    loadingEl.classList.add('hidden');
    questionsContainer.classList.add('hidden');
    emptyStateEl.classList.remove('hidden');
    errorStateEl.classList.add('hidden');
    paginationEl.classList.add('hidden');
}

function showError() {
    loadingEl.classList.add('hidden');
    questionsContainer.classList.add('hidden');
    emptyStateEl.classList.add('hidden');
    errorStateEl.classList.remove('hidden');
    paginationEl.classList.add('hidden');
}

questionsContainer.addEventListener('click', (e) => {
    if (e.target.classList.contains('star-btn') || e.target.closest('.star-btn')) {
        const btn = e.target.classList.contains('star-btn') ? e.target : e.target.closest('.star-btn');
        toggleStar(btn.getAttribute('data-question-id'), btn);
        return;
    }
});

filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const newFilter = btn.getAttribute('data-filter');
        if (newFilter === currentFilter) return;
        currentFilter = newFilter;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadQuestions(1);
    });
});

prevBtn.addEventListener('click', () => {
    if (currentPage > 1) { loadQuestions(currentPage - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) { loadQuestions(currentPage + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
retryBtn.addEventListener('click', () => loadQuestions(currentPage));

document.addEventListener('DOMContentLoaded', () => loadQuestions(1));
</script>
{% endblock %}
