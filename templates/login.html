<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登入 - 專利法 AI 刷題助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="card login-panel">
        <div class="login-header">
            <div class="icon-user">👤</div>
            <h1>專利法 AI 刷題助手</h1>
            <p>請使用 Google 或 LINE 帳號登入</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <a class="btn-google" href="{{ url_for('auth.google_login', next=next_url) }}">
            <img src="{{ url_for('static', filename='img/google-g.svg') }}" alt="" aria-hidden="true">
            <span>使用 Google 帳戶登入</span>
        </a>

        <a class="btn-line" href="{{ url_for('auth.line_login', next=next_url) }}">
            <img src="{{ url_for('static', filename='img/line_88.png') }}" alt="" aria-hidden="true">
            <span>使用 LINE 帳號登入</span>
        </a>

        <div class="login-footer">
            <p>第一次登入時會自動建立帳號</p>
        </div>
    </main>
</body>
</html>
