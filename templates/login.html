<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 專利法 AI 刷題助手</title>
    <link rel="stylesheet" href="https://cdn.muicss.com/mui-0.10.3/css/mui.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        /* Google sign-in button, light theme per Google's branding guidelines */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 44px;
            padding: 0 12px;
            background: #FFFFFF;
            border: 1px solid #747775;
            border-radius: 4px;
            color: #1F1F1F;
            font-family: Roboto, Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            text-decoration: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        
        .btn-google:hover {
            background: #F8F9FA;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3);
            color: #1F1F1F;
            text-decoration: none;
        }
        
        .btn-google:focus-visible,
        .btn-line:focus-visible {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }

        /* LINE Login button per LINE's login button guidelines (LP-0009) */
        .btn-line {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 44px;
            margin-top: 12px;
            overflow: hidden;
            background: #06C755;
            border-radius: 4px;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .btn-line img {
            flex: none;
            width: 44px;
            height: 44px;
        }

        .btn-line span {
            flex: 1;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(0, 0, 0, 0.08);
        }

        .btn-line::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #000000;
            opacity: 0;
            pointer-events: none;
        }

        .btn-line:hover,
        .btn-line:active {
            color: #FFFFFF;
            text-decoration: none;
        }

        .btn-line:hover::after {
            opacity: 0.1;
        }

        .btn-line:active::after {
            opacity: 0.3;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .alert-error {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }
        
        .alert-success {
            background-color: #efe;
            border: 1px solid #cfc;
            color: #3c3;
        }
        
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }
        
        .icon-user {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="icon-user">👤</div>
            <h1>專利法 AI 刷題助手</h1>
            <p>請使用 Google 或 LINE 帳號登入</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <a class="btn-google" href="{{ url_for('auth.google_login', next=next_url) }}">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>使用 Google 帳戶登入</span>
        </a>

        <a class="btn-line" href="{{ url_for('auth.line_login', next=next_url) }}">
            <img src="{{ url_for('static', filename='img/line_88.png') }}" alt="" aria-hidden="true">
            <span>使用 LINE 帳號登入</span>
        </a>

        <div class="login-footer">
            <p>第一次登入時會自動建立帳號</p>
        </div>
    </div>
    
</body>
</html>
