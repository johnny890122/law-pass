# LP-0003: lint and test every push and PR. Heroku auto-deploys main only
# after this passes ("Wait for CI to pass"). No secrets: OpenRouter and Google
# are mocked, and the tests default MONGO_URI to patent_act_test on localhost.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8
      - run: pytest
